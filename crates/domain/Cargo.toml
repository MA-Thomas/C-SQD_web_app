[package]
name = "csqd-domain"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
# Enables sqlx Type/Encode/Decode impls for entity id newtypes so the API
# crate can bind and decode them directly at the Postgres boundary.
sqlx = ["dep:sqlx"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres"], optional = true }
